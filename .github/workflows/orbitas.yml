# Descarga cada día las órbitas (TLE) de CelesTrak para calcular las pasadas de Landsat y Sentinel-2
name: Actualizar órbitas de satélites
on:
  schedule:
    - cron: "41 9 * * *"   # todos los días, 05:41 hora de Bolivia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  orbitas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar TLE
        run: |
          set -e
          curl -fsSL --retry 3 "https://celestrak.org/NORAD/elements/gp.php?FORMAT=tle&GROUP=resource" -o tles.txt
          grep -c "^1 " tles.txt
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tles.txt
          git diff --cached --quiet || git commit -m "Órbitas actualizadas $(date -u +%F)"
          git push
